apply plugin: 'com.android.application'

android {
    namespace 'com.sitelock.browser'
    compileSdk 35

    defaultConfig {
        applicationId 'com.sitelock.browser'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
